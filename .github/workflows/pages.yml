# Publishes the site to GitHub Pages and builds ultra.js (all of plugin/ultra.json in one
# file) on the way, so the bundle can never fall behind the plugins.
# Two jobs, as in GitHub's own Pages template: deploy-pages in the same job as the upload
# sometimes looked the artifact up before GitHub had registered it ("Found 0 artifact(s)").
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in tools/*.test.mjs server/*.test.mjs; do node "$f" || exit 1; done
      - run: node tools/build-ultra.mjs && node --check ultra.js && cp ultra.js ultra
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
